site_name: Django CRUD Views AdminLTE
theme: readthedocs
plugins:
    - search
    - awesome-pages
repo_url: https://github.com/jacob-consulting/django-crud-views-adminlte
edit_uri: blob/main/docs/

nav:
    - Home: index.md
    - Installation: installation.md
    - Menu: menu.md
    - Theme internals: theme_internals.md
    - Demo: demo.md
    - Development: development.md

markdown_extensions:
    - admonition
    - pymdownx.superfences

validation:
    anchors: warn
